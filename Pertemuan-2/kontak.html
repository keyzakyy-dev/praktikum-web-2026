<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kontak</title>
</head>
<body>
    <header>
        <h1>Formulir Kontak</h1>
    </header>
    <hr>
    <main>
        <section>
            <h2>Kirimkan Pesan atau Penawaran Proyek</h2>
            <form>
                <p>
                    <label for="nama_pengirim">Nama Lengkap Anda:</label><br>
                    <input type="text" name="nama_pengirim" id="nama_pengirim">
                </p>
                <p>
                    <label for="email_pengirim">Alamat Email:</label><br>
                    <input type="email" name="email_pengirim" id="email_pengirim">
                </p>
                <p>
                <label for="jenis_layanan">Layanan yang Dibutuhkan</label><br>
                <select name="jenis_layanan" id="jenis_layanan">
                    <option value="">--Pilih Layanan--</option>
                    <option value="web">Pembuatan Web</option>
                    <option value="other">Lain-Lain</option>
                </select>
                </p>
                <p>
                    <label for="pesan">Pesan:</label><br>
                    <textarea name="pesan" id="pesan" rows="6" cols="50"></textarea>
                </p>
                <p>
                    <button type="submit">Kirim Pesan</button>
                    <button type="reset">Batal / Reset</button>
                </p>
            </form>
        </section>
    </main>
    <hr>
    <footer>
        <p>&copy; 2026 Teknik Informatika ITG</p>
    </footer>
</body>
</html>
